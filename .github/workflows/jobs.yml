# Scheduled jobs for the production app. Vercel Hobby only allows daily crons,
# so GitHub Actions calls the job endpoints instead. Needs two repository
# secrets: APP_URL (e.g. https://app.foodtruckqc.com) and CRON_SECRET (same
# value as the CRON_SECRET env var on Vercel).
name: Scheduled jobs
on:
  schedule:
    - cron: "*/5 * * * *"   # continue an open Facebook scan
    - cron: "0 * * * *"     # hourly tick: the endpoint itself decides daily / every-two-hours by Chicago time
    - cron: "30 */6 * * *"  # venue calendars
  workflow_dispatch:
    inputs:
      kind:
        description: "facebook-daily kind (daily | every-two-hours | continue) or venue-calendars"
        default: "every-two-hours"
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call job endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
          KIND: ${{ github.event.inputs.kind }}
        run: |
          set -e
          call() { curl -sS -m 300 -X POST -H "Authorization: Bearer $CRON_SECRET" -H "Content-Type: application/json" -d "$2" "$APP_URL$1"; echo; }
          if [ -n "$KIND" ]; then
            if [ "$KIND" = "venue-calendars" ]; then call /api/public/jobs/venue-calendars '{"version":1}'; else call /api/public/jobs/facebook-daily "{\"kind\":\"$KIND\"}"; fi
          elif [ "$SCHEDULE" = "*/5 * * * *" ]; then
            call /api/public/jobs/facebook-daily '{"kind":"continue"}'
          elif [ "$SCHEDULE" = "30 */6 * * *" ]; then
            call /api/public/jobs/venue-calendars '{"version":1}'
          else
            call /api/public/jobs/facebook-daily '{"kind":"daily"}'
            call /api/public/jobs/facebook-daily '{"kind":"every-two-hours"}'
          fi
